<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMCS 2026 Class 1B Timetable">
  <meta name="theme-color" content="#171614">
  <title>SMCS 2026 Class 1B Timetable</title>
  <style>
    :root, [data-theme="light"] {
      --bg: #f5f3ee;
      --surface: #fcfbf8;
      --surface-2: #f0ede6;
      --border: rgba(40, 37, 29, 0.12);
      --text: #28251d;
      --muted: #756f66;
      --primary: #ffbf47;
      --primary-soft: #fff0cc;
      --shadow: 0 8px 28px rgba(28, 24, 16, 0.08);
      --nav: rgba(252, 251, 248, 0.9);
      --subject-default: #ece7de;
      --sticky: #fcfbf8;
      --sticky-head: #f0ede6;
    }
    [data-theme="dark"] {
      --bg: #171614;
      --surface: #201f1d;
      --surface-2: #2a2825;
      --border: rgba(255, 255, 255, 0.08);
      --text: #efede8;
      --muted: #aba59c;
      --primary: #ffbf47;
      --primary-soft: rgba(255,191,71,0.18);
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.28);
      --nav: rgba(28, 27, 25, 0.92);
      --subject-default: #3a362f;
      --sticky: #201f1d;
      --sticky-head: #2a2825;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    button { font: inherit; }
    .app { max-width: 820px; margin: 0 auto; min-height: 100dvh; padding: 20px 16px 96px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .title-wrap h1 { margin:0; font-size:1.7rem; line-height:1.05; }
    .title-wrap p { margin:6px 0 0; color:var(--muted); font-size:0.96rem; }
    .theme-toggle { min-width:46px; min-height:46px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
    .hero-card { background:linear-gradient(180deg,color-mix(in srgb, var(--primary) 34%, var(--surface)),color-mix(in srgb, var(--primary) 18%, var(--surface-2))); border:1px solid color-mix(in srgb, var(--primary) 34%, var(--border)); border-radius:24px; padding:18px; box-shadow:var(--shadow); margin-bottom:18px; }
    .hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:14px; }
    .eyebrow { display:inline-flex; padding:6px 10px; border-radius:999px; background:var(--primary-soft); color:#7a4b00; font-weight:800; font-size:0.82rem; margin-bottom:10px; }
    [data-theme="dark"] .eyebrow { color:#ffd98b; }
    .hero-date { font-size:1.28rem; font-weight:800; margin:0 0 4px; }
    .hero-sub { margin:0; color:var(--muted); }
    .hero-extra { margin-top:4px; }
    .day-chip { white-space:nowrap; border-radius:16px; background:rgba(0,0,0,0.72); color:#fff8ea; padding:12px 14px; font-weight:800; }
    .quickbar { display:flex; gap:10px; overflow:auto; }
    .quickbar button { min-height:44px; border-radius:14px; border:1px solid var(--border); background:rgba(255,255,255,0.55); color:var(--text); padding:12px 14px; white-space:nowrap; }
    .panel { display:none; margin-top:8px; }
    .panel.active { display:block; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:18px 2px 12px; }
    .section-head h2 { margin:0; font-size:1.18rem; }
    .section-head p { margin:0; color:var(--muted); font-size:0.9rem; }
    .date-picker {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 8px 12px;
      font-size: 0.95rem;
    }
    .timetable { display:grid; gap:12px; }
    .lesson { border-radius:22px; padding:14px 14px 14px 16px; border:1px solid rgba(0,0,0,0.04); box-shadow:var(--shadow); color:#181612; }
    .lesson-inner { display:grid; grid-template-columns:108px 1fr auto; gap:12px; align-items:center; }
    .time { font-size:0.95rem; color:rgba(24,22,18,0.72); font-variant-numeric:tabular-nums; }
    .subject { font-weight:900; font-size:1.1rem; }
    .tag { padding:10px 14px; border-radius:999px; background:rgba(255,255,255,0.62); font-weight:800; min-width:66px; text-align:center; }
    .empty { border:1px dashed var(--border); border-radius:20px; padding:22px 16px; text-align:center; color:var(--muted); background:var(--surface); }
    .days-table-wrap { border:1px solid var(--border); background:var(--surface); border-radius:20px; overflow:auto; box-shadow:var(--shadow); }
    .days-table { width:100%; min-width:860px; border-collapse:separate; border-spacing:0; }
    .days-table th, .days-table td { padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
    .days-table thead th { background:var(--sticky-head); font-size:0.92rem; position:sticky; top:0; z-index:2; }
    .time-col { position:sticky; left:0; z-index:1; background:var(--sticky); color:var(--muted); font-variant-numeric:tabular-nums; box-shadow:6px 0 10px rgba(0,0,0,0.04); }
    .days-table thead .time-col { z-index:3; background:var(--sticky-head); }
    .subject-cell { font-weight:800; color:#181612; border-left:1px solid rgba(0,0,0,0.04); }
    .calendar-shell { border:1px solid var(--border); background:var(--surface); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
    .calendar-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
    .calendar-toolbar h3 { margin:0; font-size:1.04rem; }
    .month-nav { display:flex; gap:8px; }
    .month-nav button { min-width:42px; min-height:42px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); }
    .month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .weekday { text-align:center; color:var(--muted); font-size:0.8rem; font-weight:800; padding-bottom:4px; }
    .day-btn {
      min-height:84px; border-radius:16px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
      padding:10px 8px; text-align:left; display:flex; flex-direction:column; justify-content:space-between;
    }
    .day-btn.muted { opacity:0.42; }
    .day-btn.active { outline:2px solid var(--primary); background:color-mix(in srgb, var(--primary) 18%, var(--surface)); }
    .day-btn.school { border-color: color-mix(in srgb, var(--primary) 34%, var(--border)); }
    .day-num { font-weight:900; }
    .cycle-badge { align-self:flex-start; padding:4px 8px; border-radius:999px; background:var(--primary-soft); color:#7a4b00; font-size:0.74rem; font-weight:900; }
    [data-theme="dark"] .cycle-badge { color:#ffd98b; }
    .calendar-note { margin:12px 2px 0; color:var(--muted); font-size:0.92rem; }
    .nav { position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(760px, calc(100vw - 24px)); background:var(--nav); backdrop-filter:blur(16px); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:24px; padding:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; z-index:10; }
    .nav button { min-height:52px; border-radius:18px; border:0; color:var(--muted); background:transparent; font-weight:800; padding:10px 8px; }
    .nav button.active { background:var(--text); color:var(--bg); }
    @media (max-width: 560px) {
      .app { padding-left:12px; padding-right:12px; }
      .lesson-inner { grid-template-columns:92px 1fr auto; gap:10px; }
      .subject { font-size:1rem; }
      .tag { min-width:58px; padding:8px 10px; }
      .hero-top { flex-direction:column; }
      .day-chip { align-self:flex-start; }
      .month-grid { gap:6px; }
      .day-btn { min-height:74px; padding:8px 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>SMCS 2026 Class 1B</h1>
        <p id="subtitle">今日時間表</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切換深色模式">🌙</button>
    </header>

    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="eyebrow">時間表</div>
          <p class="hero-date" id="heroDate">--</p>
          <p class="hero-sub" id="heroMeta">--</p>
          <p class="hero-sub hero-extra" id="readingBookText">Reading Book：--</p>
          <p class="hero-sub hero-extra" id="nextPeText">下一堂 PE：--</p>
        </div>
        <div class="day-chip" id="dayChip">Day --</div>
      </div>
      <div class="quickbar">
        <button id="todayBtn">今日</button>
        <button id="nextSchoolDayBtn">下一個上課日</button>
      </div>
    </section>

    <main>
      <section id="panel-timetable" class="panel active">
        <div class="section-head">
          <div>
            <h2>時間表</h2>
          </div>
          <input type="date" id="datePicker" class="date-picker" />
        </div>
        <div id="todayList" class="timetable"></div>
      </section>

      <section id="panel-days" class="panel">
        <div class="section-head">
          <div>
            <h2>Day I-VII 時間表</h2>
          </div>
        </div>
        <div id="daysGrid"></div>
      </section>

      <section id="panel-calendar" class="panel">
        <div class="section-head">
          <div>
            <h2>月曆</h2>
            <p>如沒有Day數即可能有假期/學校事項</p>
          </div>
        </div>
        <div class="calendar-shell">
          <div class="calendar-toolbar">
            <div>
              <h3 id="monthTitle">--</h3>
            </div>
            <div class="month-nav">
              <button id="prevMonthBtn" aria-label="上一個月">‹</button>
              <button id="nextMonthBtn" aria-label="下一個月">›</button>
            </div>
          </div>
          <div class="month-grid" id="weekdayRow"></div>
          <div class="month-grid" id="monthGrid"></div>
        </div>
        <p class="calendar-note" id="calendarNote">請在月曆揀日期。</p>
      </section>
    </main>
  </div>

  <nav class="nav" aria-label="底部導航">
    <button class="active" data-panel="timetable">時間表</button>
    <button data-panel="days">Day 1-7</button>
    <button data-panel="calendar">月曆</button>
  </nav>

  <script>
    
    const DATA_URLS = { timetable: './timetable.json', dayCycle: './day-cycle.json' };
    let timetable = {};
    let dayCycle = {};
    let todayFallbackDate = null;

    const subjectColors = {
      CHI: '#efd4bf', ENG: '#c8d8ff', MATH: '#f5db93', SCI: '#d2e7cf', ICT: '#cce6ea',
      'ICT/LIB': '#cceada', LIB: '#d8d7ef', PE: '#f7b8bd', PTH: '#e5d2f7', MUS: '#f4cfe2',
      PHum: '#d8d0c7', RE: '#d7e8c9', VA: '#ffd7c7', IL: '#e3e3e3', Reading: '#d5ead8', Tutorial: '#e8d9c6'
    };

    const order = ['I','II','III','IV','V','VI','VII'];
    const weekdays = ['日','一','二','三','四','五','六'];
    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const todayList = $('#todayList');
    const heroDate = $('#heroDate');
    const heroMeta = $('#heroMeta');
    const readingBookText = $('#readingBookText');
    const nextPeText = $('#nextPeText');
    const dayChip = $('#dayChip');
    const datePicker = $('#datePicker');
    const subtitle = $('#subtitle');
    const daysGrid = $('#daysGrid');
    const themeToggle = $('#themeToggle');
    const calendarNote = $('#calendarNote');
    const monthTitle = $('#monthTitle');
    const monthGrid = $('#monthGrid');
    const weekdayRow = $('#weekdayRow');

    let currentTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    let selectedDate = null;
    let currentMonthDate = null;
    document.documentElement.setAttribute('data-theme', currentTheme);
    syncThemeIcon();

    weekdayRow.innerHTML = weekdays.map(d => `<div class="weekday">${d}</div>`).join('');

    function syncThemeIcon() {
      themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-label', currentTheme === 'dark' ? '切換淺色模式' : '切換深色模式');
    }
    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      syncThemeIcon();
    });

    function formatDateLabel(v) {
      const d = new Date(v + 'T00:00:00');
      return d.toLocaleDateString('zh-HK', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    function colorFor(subject) { return subjectColors[subject] || getComputedStyle(document.documentElement).getPropertyValue('--subject-default'); }

    function readingBookForDay(day) {
      if (['I', 'II', 'III'].includes(day)) return '英文';
      if (['IV', 'V', 'VI'].includes(day)) return '中文';
      if (day === 'VII') return '英文/中文';
      return '--';
    }

    function nextPeDate(fromDate) {
      const dates = Object.keys(dayCycle).sort();
      const todayIsPe = ['III', 'VI'].includes(dayCycle[fromDate]);
      return dates.find(date =>
        (todayIsPe ? date > fromDate : date >= fromDate) && ['III', 'VI'].includes(dayCycle[date])
      ) || null;
    }
    function setDate(dateStr) {
      selectedDate = dateStr;
      const day = dayCycle[dateStr];
      const lessons = day ? timetable[day] || [] : [];
      heroDate.textContent = formatDateLabel(dateStr);
      heroMeta.textContent = day ? '依照 Day Cycle 顯示當日時間表' : '這天沒有上課資料';
      dayChip.textContent = day ? `Day ${day}` : 'No School';
      readingBookText.textContent = `Reading Book：${readingBookForDay(day)}`;
      const nextPe = nextPeDate(dateStr);
      nextPeText.textContent = nextPe ? `下一堂 PE：${formatDateLabel(nextPe)}` : '下一堂 PE：--';
      if (datePicker) datePicker.value = dateStr;
      subtitle.textContent = day ? `時間表 · Day ${day}` : '時間表';
      calendarNote.textContent = day ? `${formatDateLabel(dateStr)} · Day ${day}` : `${formatDateLabel(dateStr)} · 沒有上課資料`;
      if (!day || !lessons.length) {
        todayList.innerHTML = '<div class="empty">這天沒有 timetable 資料。</div>';
      } else {
        todayList.innerHTML = lessons.map(item => `
          <article class="lesson" style="background:${colorFor(item.subject).trim() || '#ece7de'}">
            <div class="lesson-inner">
              <div class="time">${item.time}</div>
              <div class="subject">${item.subject}</div>
              <div class="tag">${item.subject}</div>
            </div>
          </article>
        `).join('');
      }
      renderCalendar();
    }

    function renderDayTable() {
      const maxRows = Math.max(...order.map(day => (timetable[day] || []).length));
      const rows = [];
      for (let i = 0; i < maxRows; i++) {
        const sampleTime = order.map(day => timetable[day]?.[i]?.time).find(Boolean) || '';
        const cells = order.map(day => {
          const item = timetable[day]?.[i];
          if (!item) return '<td></td>';
          return `<td class="subject-cell" style="background:${colorFor(item.subject).trim() || '#ece7de'}">${item.subject}</td>`;
        }).join('');
        rows.push(`<tr><td class="time-col">${sampleTime}</td>${cells}</tr>`);
      }
      daysGrid.innerHTML = `
        <div class="days-table-wrap">
          <table class="days-table">
            <thead><tr><th class="time-col">時間</th>${order.map(day => `<th>Day ${day}</th>`).join('')}</tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        </div>
      `;
    }

    function showPanel(name) {
      $$('.panel').forEach(panel => panel.classList.toggle('active', panel.id === `panel-${name}`));
      $$('.nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.panel === name));
    }

    function nextSchoolDay(fromDate) {
      const dates = Object.keys(dayCycle).sort();
      return dates.find(d => d > fromDate) || fromDate;
    }

    function renderCalendar() {
      const base = currentMonthDate || new Date((selectedDate || Object.keys(dayCycle)[0]) + 'T00:00:00');
      const year = base.getFullYear();
      const month = base.getMonth();
      monthTitle.textContent = `${year}年${month + 1}月`;
      const first = new Date(year, month, 1);
      const firstDay = first.getDay();
      const start = new Date(year, month, 1 - firstDay);
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${dd}`;
        const cycle = dayCycle[key];
        const inMonth = d.getMonth() === month;
        const active = key === selectedDate ? 'active' : '';
        const school = cycle ? 'school' : '';
        const muted = inMonth ? '' : 'muted';
        cells.push(`
          <button class="day-btn ${active} ${school} ${muted}" data-date="${key}">
            <span class="day-num">${d.getDate()}</span>
            ${cycle ? `<span class="cycle-badge">Day ${cycle}</span>` : '<span></span>'}
          </button>
        `);
      }
      monthGrid.innerHTML = cells.join('');
      $$('#monthGrid .day-btn').forEach(btn => btn.addEventListener('click', () => {
        const date = btn.dataset.date;
        setDate(date);
        showPanel('timetable');
      }));
    }

    $('#prevMonthBtn').addEventListener('click', () => {
      const base = currentMonthDate || new Date((selectedDate || Object.keys(dayCycle)[0]) + 'T00:00:00');
      currentMonthDate = new Date(base.getFullYear(), base.getMonth() - 1, 1);
      renderCalendar();
    });
    $('#nextMonthBtn').addEventListener('click', () => {
      const base = currentMonthDate || new Date((selectedDate || Object.keys(dayCycle)[0]) + 'T00:00:00');
      currentMonthDate = new Date(base.getFullYear(), base.getMonth() + 1, 1);
      renderCalendar();
    });
    $('#todayBtn').addEventListener('click', () => setDate(todayFallbackDate || selectedDate));
    $('#nextSchoolDayBtn').addEventListener('click', () => setDate(nextSchoolDay(selectedDate || todayFallbackDate)));
    datePicker.addEventListener('change', () => {
      if (datePicker.value && dayCycle[datePicker.value] !== undefined) {
        setDate(datePicker.value);
      }
    });
    $$('.nav button').forEach(btn => btn.addEventListener('click', () => showPanel(btn.dataset.panel)));

    async function startApp() {
      try {
        await loadJsonData();
      } catch (err) {
        console.error(err);
        heroDate.textContent = '資料載入失敗';
        heroMeta.textContent = err.message || '無法讀取 JSON';
        dayChip.textContent = 'Day --';
        todayList.innerHTML = '<div class="empty">' + (err.message || '無法讀取 JSON') + '</div>';
        daysGrid.innerHTML = '<div class="empty">' + (err.message || '無法讀取 JSON') + '</div>';
        return;
      }
      const today = new Date();
      const todayStr = today.toISOString().slice(0, 10);
      const availableDates = Object.keys(dayCycle).sort();
      const fallbackDate = dayCycle[todayStr] ? todayStr : availableDates.find(d => d >= todayStr) || availableDates[0];
      todayFallbackDate = fallbackDate;
      if (datePicker) {
        const sortedDates = availableDates;
        datePicker.min = sortedDates[0] || '';
        datePicker.max = sortedDates[sortedDates.length - 1] || '';
      }
      currentMonthDate = fallbackDate ? new Date(fallbackDate + 'T00:00:00') : new Date();
      renderDayTable();
      if (fallbackDate) {
        setDate(fallbackDate);
      } else {
        heroDate.textContent = '未有日期資料';
        heroMeta.textContent = '找不到 day-cycle 資料';
        dayChip.textContent = 'Day --';
        todayList.innerHTML = '<div class="empty">day-cycle.json 未有可用日期。</div>';
      }
    }

    function normalizeDayKey(v) {
      if (!v) return null;
      let s = String(v).trim().toUpperCase();
      s = s.replace(/^DAY\s*/, '');
      const map = { '1':'I', '2':'II', '3':'III', '4':'IV', '5':'V', '6':'VI', '7':'VII' };
      return map[s] || s;
    }

    function normalizeTimetableKeys(data) {
      const out = {};
      for (const [key, lessons] of Object.entries(data || {})) {
        const day = normalizeDayKey(key);
        out[day] = (lessons || []).map(item => ({
          time: item.time || (item.start && item.end ? `${item.start}\u2013${item.end}` : ''),
          subject: (item.subject || '').trim()
        }));
      }
      return out;
    }

    function normalizeDayCycleKeys(data) {
      const out = {};
      for (const [date, day] of Object.entries(data || {})) {
        out[date] = normalizeDayKey(day);
      }
      return out;
    }

    async function loadJsonData() {
      const [timetableRes, dayCycleRes] = await Promise.all([
        fetch(DATA_URLS.timetable + '?v=' + Date.now(), { cache: 'no-store' }),
        fetch(DATA_URLS.dayCycle + '?v=' + Date.now(), { cache: 'no-store' })
      ]);

      if (!timetableRes.ok) throw new Error('timetable.json 載入失敗 (' + timetableRes.status + ')');
      if (!dayCycleRes.ok) throw new Error('day-cycle.json 載入失敗 (' + dayCycleRes.status + ')');

      const t = await timetableRes.json();
      const d = await dayCycleRes.json();

      if (!t || typeof t !== 'object' || !Object.keys(t).length) throw new Error('timetable.json 沒有可用資料');
      if (!d || typeof d !== 'object' || !Object.keys(d).length) throw new Error('day-cycle.json 沒有可用資料');

      timetable = normalizeTimetableKeys(t);
      dayCycle = normalizeDayCycleKeys(d);
    }

    startApp();
  </script>
</body>
</html>
