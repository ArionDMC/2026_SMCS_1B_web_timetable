<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Class 1B Timetable</title><link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet"><style>body{font-family:Satoshi,Arial,sans-serif;margin:0;background:#f7f6f2;color:#28251d}.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}.card{background:#fff;border:1px solid #d4d1ca;border-radius:20px;padding:16px;margin:12px 0}h1{margin:0 0 6px;font-size:28px}h2{margin:0 0 10px;font-size:18px}.muted{color:#6f6d67}.hero{background:#eef7f6}.pill{display:inline-block;background:#01696f;color:#fff;padding:8px 12px;border-radius:999px;font-weight:700}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button,.btn{min-height:48px;border:none;border-radius:14px;padding:12px;font-weight:700}.quick button{background:#fff;border:1px solid #d4d1ca}.btn{background:#01696f;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:12px;border:1px solid #d4d1ca;border-radius:14px}ul{list-style:none;padding:0;margin:0}li{padding:12px 0;border-top:1px solid #eee}li:first-child{border-top:none}.time{font-weight:700}.note{margin-top:10px;padding:12px;border-radius:14px;background:#f7f6f2;border:1px solid #e5e7eb}.bottom{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);padding:10px;border:1px solid #ddd;border-radius:20px}@media(min-width:768px){.bottom{display:none}}</style></head><body><div class="wrap"><div class="card"><h1>Class 1B</h1><div class="muted">GitHub Pages ready mobile timetable</div></div><div class="card hero"><div id="summary">載入中…</div><div id="nextpe" class="muted" style="margin-top:8px"></div><div id="readingBook" class="note">Reading Book：--</div></div><div class="quick"><button id="todayBtn">今日</button><button id="tomorrowBtn">明天</button><button id="nextBtn">下一個上課日</button><button id="peBtn">最近 PE</button></div><div class="card"><h2>查日期</h2><div class="row"><input id="dateInput" type="date"><button class="btn" id="applyBtn">查看</button></div></div><div class="card"><h2>當日課表</h2><ul id="list"></ul></div></div><div class="bottom"><button id="bToday">今日</button><button id="bTomorrow">明天</button><button id="bPe">PE</button><button id="bTop">頂部</button></div><script>const dayCycle=[{"date": "2026-09-07", "dayCycle": "I"}, {"date": "2026-09-08", "dayCycle": "II"}, {"date": "2026-09-09", "dayCycle": "III"}, {"date": "2026-09-10", "dayCycle": "IV"}, {"date": "2026-09-11", "dayCycle": "V"}, {"date": "2026-09-14", "dayCycle": "VI"}, {"date": "2026-09-15", "dayCycle": "VII"}, {"date": "2026-09-16", "dayCycle": "I"}, {"date": "2026-09-17", "dayCycle": "II"}, {"date": "2026-09-18", "dayCycle": "III"}, {"date": "2026-09-21", "dayCycle": "IV"}, {"date": "2026-09-22", "dayCycle": "V"}, {"date": "2026-09-23", "dayCycle": "VI"}, {"date": "2026-09-24", "dayCycle": "VII"}];const timetable=[{"dayCycle": "I", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B CHI"}, {"dayCycle": "II", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B VA"}, {"dayCycle": "III", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B PTH"}, {"dayCycle": "IV", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B SCI"}, {"dayCycle": "V", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B CHI"}, {"dayCycle": "VI", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B PHum"}, {"dayCycle": "VII", "timeWholeDay": "8:25-9:00", "timeHalfDay": "8:25-8:50", "subject": "1B SCI"}];const $=s=>document.querySelector(s);const zh=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];function wd(d){return zh[new Date(d+"T00:00:00").getDay()]}function findDay(d){return dayCycle.find(x=>x.date===d)}function nextSchool(d){return dayCycle.find(x=>x.date>d)}function nextPE(d){return dayCycle.find(x=>x.date>=d&&["III","VI"].includes(x.dayCycle))}function addDays(d,n){const dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10)}function tomorrowDay(d){const t=addDays(d,1);return findDay(t)||nextSchool(t)}function readingBook(day){if(['I','II','III'].includes(day)) return '英文'; if(['IV','V','VI'].includes(day)) return '中文'; if(day==='VII') return '英文/中文'; return '--'}function setDate(d){$('#dateInput').value=d;render()}function render(){const d=$('#dateInput').value;const rec=findDay(d);const list=$('#list');list.innerHTML='';if(!rec){$('#summary').textContent='這一天沒有 Day Cycle 資料。';$('#nextpe').textContent='';$('#readingBook').textContent='Reading Book：--';list.innerHTML='<li class=muted>這一天沒有課表資料。</li>';return}$('#summary').innerHTML=`<span class=pill>Day ${rec.dayCycle}</span> <div style="margin-top:10px">${rec.date} · ${wd(rec.date)}</div>`;const pe=nextPE(d);$('#nextpe').textContent=pe?`最近 PE：${pe.date}（${wd(pe.date)}，Day ${pe.dayCycle}）`:'未找到之後的 PE 日期';$('#readingBook').textContent=`Reading Book：${readingBook(rec.dayCycle)}`;const items=timetable.filter(x=>x.dayCycle===rec.dayCycle);if(!items.length){list.innerHTML='<li class=muted>這一天沒有課表資料。</li>';return}items.forEach(x=>{const li=document.createElement('li');li.innerHTML=`<div class=time>${x.timeWholeDay||'-'}</div><div>${x.subject}</div><div class=muted>Half day: ${x.timeHalfDay||'-'}</div>`;list.appendChild(li)})}const today=new Date().toISOString().slice(0,10);setDate(findDay(today)?today:dayCycle[0].date);$('#applyBtn').onclick=()=>render();$('#todayBtn').onclick=()=>{const t=new Date().toISOString().slice(0,10);const rec=findDay(t)||nextSchool(t);if(rec)setDate(rec.date)};$('#tomorrowBtn').onclick=()=>{const rec=tomorrowDay($('#dateInput').value||new Date().toISOString().slice(0,10));if(rec)setDate(rec.date)};$('#nextBtn').onclick=()=>{const rec=nextSchool($('#dateInput').value);if(rec)setDate(rec.date)};$('#peBtn').onclick=()=>{const rec=nextPE($('#dateInput').value);if(rec)setDate(rec.date)};$('#bToday').onclick=()=>$('#todayBtn').click();$('#bTomorrow').onclick=()=>$('#tomorrowBtn').click();$('#bPe').onclick=()=>$('#peBtn').click();$('#bTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});$('#dateInput').addEventListener('change',render);</script></body></html>
