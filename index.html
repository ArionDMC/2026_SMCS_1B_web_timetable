<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 SMCS Class 1B 時間表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root,
    [data-theme="light"] {
      --bg: #f7f6f2;
      --surface: #fbfaf7;
      --surface-2: #f1f4f4;
      --text: #222;
      --muted: #6d6c68;
      --faint: #8c877f;
      --line: #d7d4cd;
      --primary: #2d6f73;
      --chip: #ece9e4;
      --shadow: 0 8px 24px rgba(0,0,0,.05);
    }

    [data-theme="dark"] {
      --bg: #181715;
      --surface: #22201d;
      --surface-2: #283032;
      --text: #ece9e1;
      --muted: #b1aca3;
      --faint: #8e887f;
      --line: #3d3934;
      --primary: #5ca1a7;
      --chip: #2b2926;
      --shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans HK", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
    }

    .overview {
      background: var(--surface-2);
    }

    .meta {
      margin: 14px 0 0;
      font-size: 18px;
    }

    .chip {
      margin-top: 12px;
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      min-height: 52px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .search input {
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      border: 1px solid var(--line);
      padding: 0 16px;
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 14px;
    }

    .lessons {
      display: grid;
      gap: 12px;
    }

    .lesson {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .lesson:first-child {
      border-top: none;
      padding-top: 0;
    }

    .time {
      font-size: 16px;
      font-weight: 800;
    }

    .subject {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      margin-top: 4px;
    }

    .lesson.non-class .time,
    .lesson.non-class .subject {
      color: var(--faint);
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .iconbtn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .wrapper {
        padding: 10px;
      }

      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .subject {
        font-size: 22px;
      }

      .hero h1 {
        font-size: 22px;
      }

      .search {
        grid-template-columns: 1fr auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="topbar">
      <button class="iconbtn" id="themeBtn" aria-label="toggle theme">◐</button>
    </div>

    <section class="card hero">
      <h1>2026 SMCS Class 1B 時間表</h1>
    </section>

    <section class="card overview">
      <span class="badge" id="dayBadge">--</span>
      <div class="meta" id="dateText">--</div>
      <div class="meta" id="peText">下一次 PE 堂：--</div>
      <div class="chip" id="readingBook">Reading Book：--</div>
    </section>

    <section class="actions card" style="padding:12px;background:transparent;border:none;box-shadow:none;margin-top:-4px">
      <button class="btn" id="todayBtn">今日</button>
      <button class="btn" id="tomorrowBtn">明天</button>
      <button class="btn" id="nextSchoolBtn">下一個上課日</button>
      <button class="btn" id="nextPeBtn">最近 PE</button>
    </section>

    <section class="card">
      <div class="field">
        <label for="dateInput">查日期</label>
      </div>
      <div class="search">
        <input id="dateInput" type="date">
        <button class="btn primary" id="goBtn">查看</button>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">當日課表</h2>
      <div class="lessons" id="lessons"></div>
    </section>
  </div>
